<script type="module">
/* ═══ SUMO BUMPERS · a Multiplayer Agent starter ══════════════════════════════════════
 * Bump everyone off the ring before it crumbles. Party, 2–8; bots fill the ring.
 * Last one on the ring wins the round; first to CONFIG.winsToWin rounds wins the match.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ match rules, movement, bump strength, how the ring crumbles
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SCENE ......... renderer, sunset sky, sea, rocks, lanterns, particles, sounds
 *   RING .......... the platform: rings of segments that fall on a timetable made from
 *                   the round's seed, so every client drops the same piece at the same moment
 *   BUMPERS ....... the round bumper model, name tags, the crown
 *   PHYSICS ....... rolling, dashing, falling (same code for you and the bots) and bumps
 *   MATCH (HOST) .. rounds, who fell, round wins, the bots and every bump. Only the host
 *                   writes these.
 *   ME ............ your bumper. Each player writes only its own.
 *   HUD & RESULTS . banner, countdown, round wins, results card, leaderboard
 *   INPUT ......... keyboard, touch stick and Dash button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: round key, position,
 *     velocity, heading, dashing) about 15 times a second, `o` (the round key it fell out
 *     of) once, `hb` (heartbeat) once a second, and `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `game` (id, v, phase,
 *     round, seed, timers, who is in, who fell, round wins, the winner) and `bots`.
 *     A new host adopts both from state and carries on.
 *   - Bumps are HOST-RUN: the host checks every pair of bumpers (its own, the bots, and
 *     everyone else at their latest position + velocity) and sends one "bump" event
 *     {a, b, nx, nz, ua, ub, x, z, p} per hit. The two players named set their own speed
 *     along the hit (ua / ub); everyone shows the sparks. Each player only nudges itself
 *     out of the others so bumpers never pass through each other.
 *   - The ring falls on a timetable made from the round seed and the round start time, so
 *     every client drops the same segment at the same moment. Each player checks its OWN
 *     bumper against the floor and reports its own fall; the host only counts.
 *   - "again" asks the host to start the next match sooner.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "sumo-wins": matches won (submitted with "inc"), on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 6,              // bots fill the ring up to this many bumpers
  winsToWin: 3,          // round wins that take the match
  introMs: 3500,         // "Round N" and 3-2-1 before each round
  overMs: 3500,          // the "wins the round" pause
  resultsMs: 12000,      // results card before the next match
  // rolling
  accel: 13,             // how hard you push, units/s²
  drag: 1.5,             // how fast sliding slows (per second); top speed ≈ accel / drag
  dashSpeed: 13,         // a dash launches you at this speed
  dashTime: 0.35,        // a dash makes you heavy for this long (s)
  dashCooldown: 1.2,     // seconds between dashes
  gravity: 26,
  outY: -4,              // fall below this and you're out
  // bumping (the host works these out)
  radius: 0.9,           // bumper radius
  bounce: 0.8,           // share of the closing speed that bounces back (1 = all of it)
  pop: 3,                // extra push apart on every bump, units/s
  dashMass: 1.8,         // a dashing bumper counts this many times as heavy
  stunTime: 0.5,         // after a bump you can barely steer for this long (s)
  botDash: 0.06,         // chance per frame a lined-up bot dashes (higher = meaner bots)
  // the ring
  edges: [13, 11, 9, 7, 5, 3], // ring edges, outside in; the disc inside the last one falls last
  segLen: 3.2,           // rough length of one ring segment
  shrinkStart: 8,        // seconds after BUMP! the outer ring starts to fall
  ringEvery: 7,          // seconds between rings
  ringSpread: 3,         // a ring's segments fall over this many seconds
  warnTime: 1.5,         // segments shake and glow red this long before they fall
  hurry: 3,              // once every person is out, the ring falls this much faster
  board: "sumo-wins",
};
const BOT_NAMES = ["Chonk", "Dumpling", "Mochi", "Boulder", "Biscuit", "Tofu", "Meatball", "Bao", "Pudding", "Noodle", "Gnocchi", "Muffin", "Tater", "Waffles"];
const COLORS = ["#ff4d6d", "#4dabff", "#ffd23f", "#52d273", "#b47dff", "#ff8c42", "#ff6fb5", "#3de0d0", "#a3e635", "#f8fafc", "#60a5fa", "#e879f9"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'sumo-bumpers',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {

  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };

    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),

    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes

const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();

function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;

let net = null, S = { entities: { players: {} }, shared: {} }, dropped = false;
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });

const isHost = () => livePlayers()[0] === net.sessionId;
const isBot = (id) => id[0] === "@"; // bot ids look like "@3"; sessionIds never have an @

// ── SCENE ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: !ATTRACT }); // the preview recorder renders in software: keep it cheap
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 500);
function fit() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#ffe9d6", "#b98a8a", 1.6));
const sun = new THREE.DirectionalLight("#ffd0a0", 1.9); sun.position.set(-30, 45, 25); scene.add(sun);
function canvasTex(w, h, paint, repeat) {

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;

}

const mat = (color, extra) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, ...extra });
const SEA_Y = -12;
scene.background = canvasTex(4, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#2c2366"); g.addColorStop(0.45, "#a2477a"); g.addColorStop(0.75, "#ff8a5c"); g.addColorStop(1, "#ffc98a"); c.fillStyle = g; c.fillRect(0, 0, w, h); });
scene.fog = new THREE.Fog("#f39a78", 70, 190);
// the sea everyone falls into: a wavy texture that drifts
const seaTex = canvasTex(128, 128, (c, w, h) => {
  c.fillStyle = "#26507e"; c.fillRect(0, 0, w, h); c.lineWidth = 2;
  for (let i = 0; i < 5; i++) { const y = (i * 29 + 8) % h; c.strokeStyle = i % 2 ? "#3a6c9c" : "#335f8f"; c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(w * 0.3, y - 7, w * 0.6, y + 7, w, y); c.stroke(); }
  c.fillStyle = "#b9837f"; for (let i = 0; i < 3; i++) c.fillRect((i * 47) % w, (i * 71 + 20) % h, 8 + (i % 2) * 6, 2); // sunset glints
}, true);
seaTex.repeat.set(36, 36);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), mat("#ffffff", { map: seaTex, roughness: 0.45, metalness: 0.1, emissive: "#1a1840", emissiveIntensity: 0.5 }));
sea.rotation.x = -Math.PI / 2; sea.position.y = SEA_Y; scene.add(sea);
// the stone pillar the ring stands on
const rockTex = canvasTex(64, 64, (c) => { c.fillStyle = "#7c4f45"; c.fillRect(0, 0, 64, 64); c.fillStyle = "#6a4039"; for (let y = 0; y < 64; y += 16) c.fillRect(0, y, 64, 6); }, true);
rockTex.repeat.set(6, 3);
const pillar = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 3.6, 11, 24), mat("#ffffff", { map: rockTex }));
pillar.position.y = -1.2 - 5.5; scene.add(pillar);
// rock stacks in the sea and floating lanterns (one instanced mesh each)
const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), e3 = new THREE.Euler(), v3 = new THREE.Vector3(), one = new THREE.Vector3();
const rocks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.7, 1, 1, 7), mat("#6b4a86", { flatShading: true }), 16);
for (let i = 0; i < 16; i++) {
  const a = (i / 16) * Math.PI * 2 + (i % 3) * 0.2, r = 70 + (i % 4) * 22, h = 18 + ((i * 7) % 5) * 8, w = 4 + (i % 3) * 2;
  rocks.setMatrixAt(i, mtx.compose(v3.set(Math.cos(a) * r, SEA_Y + h / 2, Math.sin(a) * r), q.setFromEuler(e3.set(0, i, 0)), one.set(w, h, w)));
}
scene.add(rocks);
const LANTERNS = 22, lanterns = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.32, 0.26, 0.6, 8), new THREE.MeshBasicMaterial({ color: "#ffc061" }), LANTERNS);
const lanternSpots = Array.from({ length: LANTERNS }, (_, i) => ({ a: (i / LANTERNS) * Math.PI * 2 + (i % 2) * 0.1, r: 34 + (i % 4) * 7, y: 5 + (i % 5) * 2.5 }));
lanterns.frustumCulled = false; scene.add(lanterns);
// confetti, sparks and splashes: a ring buffer of little squares
const PARTS = 320, parts = Array.from({ length: PARTS }, () => ({ life: 0 }));
const partMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.26, 0.26), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), PARTS);
partMesh.setColorAt(0, new THREE.Color("#fff")); partMesh.frustumCulled = false; scene.add(partMesh);
let nextPart = 0;
function burst(x, y, z, color, n = 14, speed = 6, up = 1) {
  const c = new THREE.Color(color);
  for (let i = 0; i < n; i++) {
    const p = parts[nextPart]; partMesh.setColorAt(nextPart, c); nextPart = (nextPart + 1) % PARTS;
    Object.assign(p, { x, y, z, vx: (Math.random() - 0.5) * speed, vy: Math.random() * speed * up, vz: (Math.random() - 0.5) * speed, life: 0.7 + Math.random() * 0.6, r: Math.random() * 6 });
  }
  partMesh.instanceColor.needsUpdate = true;
}
function drawScenery(dt, now) {
  parts.forEach((p, i) => {
    if (p.life > 0) { p.life -= dt; p.vy -= 14 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.r += dt * 6; }
    const s = p.life > 0 ? Math.min(1, p.life * 2) : 0;
    partMesh.setMatrixAt(i, mtx.compose(v3.set(p.x || 0, p.y || 0, p.z || 0), q.setFromEuler(e3.set(p.r || 0, (p.r || 0) * 0.7, 0)), one.set(s, s, s)));
  });

  lanternSpots.forEach((d, i) => lanterns.setMatrixAt(i, mtx.compose(v3.set(Math.cos(d.a + now / 60000) * d.r, d.y + Math.sin(now / 1400 + i) * 0.8, Math.sin(d.a + now / 60000) * d.r), q.identity(), one.set(1, 1, 1))));

  seaTex.offset.set(now / 90000, now / 50000);
}
// Sounds, made on the fly with WebAudio (no files).
let audio = null, noise = null;
function unlockAudio() {
  if (audio || ATTRACT) return;

    audio = new AudioContext();
    noise = audio.createBuffer(1, audio.sampleRate * 0.5, audio.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch {}
}

// ── RING ────────────────────────────────────────────────────────────────────────────
// Rings of segments, outside in (RINGS[0] is the outer one), plus a disc in the middle.
// Segment j of a ring is centered at angle j / n · 2π (measured as atan2(z, x)).
// setup(seed) makes the timetable: fallT[k][j] = seconds after BUMP! that segment falls.

  build() {

      c.strokeStyle = "#fff3dc"; c.lineWidth = 10; c.beginPath(); c.arc(128, 128, 88, 0, 7); c.stroke();

    const score = (o) => Math.hypot(o.b.x - b.x, o.b.z - b.z) - Math.hypot(o.b.x, o.b.z) * 0.4 + (isBot(o.id) ? 0 : t < 3 ? 99 : -1) + Math.random() * 3;
    b.target = others.map((o) => [o.id, score(o)]).sort((x, y) => x[1] - y[1])[0][0]; b.retarget = now + 1500 + Math.random() * 2000;
  }
  const o = others.find((x) => x.id === b.target).b;
  const orr = Math.hypot(o.x, o.z) || 1, ox = o.x / orr, oz = o.z / orr, dx = o.x - b.x, dz = o.z - b.z, d = Math.hypot(dx, dz) || 1;
  // 3. just hit them: back off toward my side for a moment, then come again
  if (d < 2 * R + 0.25 && now > (b.backUntil || 0) + 300) b.backUntil = now + 350 + Math.random() * 300;
  if (now < (b.backUntil || 0)) { const bx = -dx / d - b.x / r * 0.5, bz = -dz / d - b.z / r * 0.5, bl = Math.hypot(bx, bz) || 1; return { mx: (bx / bl) * b.pace, mz: (bz / bl) * b.pace, dash: false }; }
  // 4. come at them from the middle, so the push sends them toward the edge
  const lined = (dx * ox + dz * oz) / d; // 1 = I'm right between them and the middle
  const gx = lined > 0.5 || d < 2.4 ? o.x + ox * 0.6 : o.x - ox * 2.4, gz = lined > 0.5 || d < 2.4 ? o.z + oz * 0.6 : o.z - oz * 2.4;
  const mx = gx - b.x + b.errX, mz = gz - b.z + b.errZ, ml = Math.hypot(mx, mz) || 1;
  const dash = t > 2.5 && b.dashCd <= 0 && lined > 0.6 && d > 2 && d < 4.5 && Math.random() < CONFIG.botDash * b.skill;
  return { mx: (mx / ml) * b.pace, mz: (mz / ml) * b.pace, dash };
}
function botList() {
  if (!isHost()) return shared("bots", []);
  const r2 = (v) => Math.round(v * 100) / 100;
  return [...host.bots.values()].filter((b) => b.active).map((b) => ({ i: b.id, n: b.name, c: b.color, x: r2(b.x), y: r2(b.y), z: r2(b.z), vx: r2(b.vx), vz: r2(b.vz), h: r2(b.h), d: b.dashT > 0 ? 1 : 0 }));
}

// ── ME ──────────────────────────────────────────────────────────────────────────────
let myName = "", myColor = COLORS[0]; // the color is picked on join: the first one nobody has
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
if (!myName) myName = ["Bouncy", "Rolling", "Mighty", "Wobbly", "Sneaky", "Jolly"][Math.floor(Math.random() * 6)] + " " + ["Dumpling", "Boulder", "Meatball", "Bun", "Pebble"][Math.floor(Math.random() * 5)];
const me = { ...newBody(), outKey: "", lastSend: 0, view: null };
const local = { key: "", bigUntil: 0, big: "", shake: 0, lastBeep: 0, lastPhase: "" };
const nameOf = (id) => (id === net.sessionId ? myName : isBot(id) ? host.bots.get(id)?.name || "Bot" : S.entities.players[id]?.n || "Player");
const colorOf = (id) => (id === net.sessionId ? myColor : isBot(id) ? host.bots.get(id)?.color || "#ccc" : S.entities.players[id]?.c || "#ccc");
const amIn = (g) => g.inRound.includes(net.sessionId) && !g.out.includes(net.sessionId) && me.outKey !== keyOf(g);
const remotes = new Map(); // id -> { raw, p, at }: everyone's latest `p`, and when it arrived (on our clock)
function remoteOf(id) {
  const raw = S.entities.players[id]?.p; if (typeof raw !== "string") return null;
  let r = remotes.get(id);
  if (!r || r.raw !== raw) { const p = parse(raw, null); if (!p) return null; r = { raw, p, at: performance.now() }; remotes.set(id, r); }
  return r;
}
let botsSeen = { raw: "", at: 0 };

/** A new round seen in state: set up the ring and put my bumper on its spot. */
function onNewKey(g) {
  local.key = keyOf(g);
  ring.setup(g.seed);
  Object.assign(me, spawnAt(Math.max(0, g.inRound.indexOf(net.sessionId)), g.inRound.length), { y: 0, vx: 0, vy: 0, vz: 0, falling: false, dashT: 0, dashCd: 0.5, stun: 0, outKey: "" });
  for (const v of [...views.values(), me.view]) if (v) { v.splashed = false; v.fresh = true; }
  $("over").hidden = true;
}
function myTick(dt, g) {
  const key = keyOf(g), t = arenaTime(g);
  if (!g.inRound.includes(net.sessionId) || me.y < SEA_Y - 2) { publish(""); return; } // watching
  if (g.phase === "fight" && t < 0) { Object.assign(me, spawnAt(g.inRound.indexOf(net.sessionId), g.inRound.length)); publish(key); return; }
  const playing = amIn(g) && g.phase === "fight";
  const inp = !playing && g.phase === "fight" ? { mx: 0, mz: 0, dash: false } : ATTRACT ? (playing ? botBrain(me, net.sessionId, t, hostBodies(g)) : { mx: 0, mz: 0, dash: false }) : readInput();
  stepBody(me, inp.mx, inp.mz, inp.dash, dt, t);
  if (!isHost()) separate(me, [...views.values()].filter((v) => v.g.visible)); // the host does this in collide()
  if (me.y < CONFIG.outY && g.phase === "fight" && me.outKey !== key && !g.out.includes(net.sessionId)) { me.outKey = key; net.me.set("o", key); bigText("SPLASH!", 1800); }
  publish(key);
}
function publish(k) {
  const now = performance.now();
  if (now - me.lastSend < 66) return; // ~15/s
  me.lastSend = now;
  const r2 = (v) => Math.round(v * 100) / 100;
  const json = JSON.stringify({ k, x: r2(me.x), y: r2(me.y), z: r2(me.z), vx: r2(me.vx), vz: r2(me.vz), h: r2(me.h), d: me.dashT > 0 ? 1 : 0 });
  if (json !== me.lastJson) { me.lastJson = json; net.me.set("p", json); } // standing still sends nothing
}
/** Sparks, sound and squash for a bump; and if it names me, my new speed. */
function bumpFx(m) {
  if (m.a === net.sessionId && !isHost()) kick(me, m.nx, m.nz, m.ua);
  if (m.b === net.sessionId && !isHost()) kick(me, m.nx, m.nz, m.ub);
  const power = Math.min(1, m.p / 14);
  burst(m.x, R, m.z, "#fff6c8", 8 + Math.round(power * 14), 4 + power * 8, 0.8);
  for (const id of [m.a, m.b]) { const v = id === net.sessionId ? me.view : views.get(id); if (v) v.squash = 0.6 + power * 0.6; }
  if (m.a === net.sessionId || m.b === net.sessionId) local.shake = Math.max(local.shake, 0.15 + power * 0.5);
  sfx("bump", power);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bigText = (html, ms) => { local.big = html; local.bigUntil = performance.now() + ms; };
let board = null, boardFor = -1;
const startedAt = performance.now();
function hud(g) {
  const t = arenaTime(g), now = Date.now(), left = aliveIn(g), you = (id) => id === net.sessionId;
  let big = performance.now() < local.bigUntil ? local.big : "";
  if (g.phase === "fight" && t < 0) big = t < -3 ? `<small>Round ${g.round} · first to ${CONFIG.winsToWin}</small>READY` : String(Math.ceil(-t));
  else if (g.phase === "fight" && t < 0.8) big = "BUMP!";
  else if (g.phase === "over") big = !g.rw ? "<small>They fell together</small>NO WINNER" : you(g.rw) ? "<small>Last one on the ring</small>YOU WIN!" : `<small>wins round ${g.round}</small><span class="name">${esc(rosterName(g, g.rw))}</span>`;
  if (g.phase === "fight" && t < 0 && Math.ceil(-t) !== local.lastBeep && t > -3) { local.lastBeep = Math.ceil(-t); sfx("beep"); }
  if (local.lastPhase !== g.phase + g.round && g.phase !== "fight") { if (g.rw === net.sessionId) sfx("win"); }
  if (g.phase === "fight" && t >= 0 && local.lastBeep > 0) { local.lastBeep = 0; sfx("go"); }
  local.lastPhase = g.phase + g.round;
  $("big").innerHTML = ATTRACT ? "" : big;
  if (ATTRACT) { $("round").textContent = $("msg").textContent = $("net").textContent = $("ranks").textContent = ""; return; }
  $("round").innerHTML = g.phase === "results" ? "" : `Round ${g.round} · first to ${CONFIG.winsToWin} wins<small>${left.length} of ${g.inRound.length} still on the ring</small>`;
  const watching = !amIn(g) && g.phase === "fight" && t >= 0;
  $("msg").textContent = watching ? (g.inRound.includes(net.sessionId) ? "You're in the sea · back in next round" : "Watching · you're in the next round")
    : (performance.now() - startedAt < 14000 && g.phase === "fight") ? (touchUI ? "Drag to roll · tap DASH · bump everyone off!" : "Roll with WASD · Space to dash · bump everyone off!") : "";
  const order = [...g.inRound].sort((a, b) => (g.wins[b] || 0) - (g.wins[a] || 0));
  $("ranks").innerHTML = g.phase === "results" ? "" : order.map((id) => `<div class="${g.out.includes(id) ? "out" : ""}"><i style="background:${esc(rosterColor(g, id))}"></i>${esc(you(id) ? "You" : rosterName(g, id))}<b>${"●".repeat(g.wins[id] || 0)}</b></div>`).join("");
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the bumps" : ""}`;
  $("over").hidden = !(g.phase === "results" && now - g.endedAt > 1500);
  if (g.phase === "results") results(g, now);
}
function results(g, now) {
  $("title").textContent = g.win === net.sessionId ? "You win the match! 🏆" : `${rosterName(g, g.win)} wins the match! 🏆`;
  const order = g.roster.map((r) => r[0]).sort((a, b) => (g.wins[b] || 0) - (g.wins[a] || 0));
  $("results").innerHTML = order.slice(0, 10).map((id) => `<li class="${id === net.sessionId ? "me" : ""}">${esc(id === net.sessionId ? "You" : rosterName(g, id))}${id === g.win ? " 🏆" : ""}<span>${g.wins[id] || 0} round${(g.wins[id] || 0) === 1 ? "" : "s"}</span></li>`).join("");
  $("next").textContent = `Next match in ${Math.max(0, Math.ceil((g.endsAt - now) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(g.win === net.sessionId); }
}
function showBoard(won) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} 🏆</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "results") return; if (isHost()) playAgain(g); else net.send("again", {}); $("over").hidden = true; };
const playAgain = (g) => { if (g.phase === "results") writeGame({ ...g, endsAt: Math.min(g.endsAt, Date.now() + 1200) }); };
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId
 *  picks again. A bot wearing my color makes me pick again too (the host only recolors bots between rounds). */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), botColors = botList().map((b) => b.c);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
  if (me.view) recolor(me.view, myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("dash").hidden = !touchUI;
const keys = new Set(), stick = { id: -1, x: 0, y: 0, mx: 0, mz: 0 };
let dashAt = 0;
addEventListener("keydown", (e) => {
  unlockAudio(); keys.add(e.key.toLowerCase());
  if (e.key === " " || e.key === "Shift") { e.preventDefault(); dashAt = performance.now(); }
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
function readInput() {
  const k = (a, b) => (keys.has(a) || keys.has(b) ? 1 : 0);
  const mx = k("d", "arrowright") - k("a", "arrowleft") + stick.mx, mz = k("s", "arrowdown") - k("w", "arrowup") + stick.mz;
  return { mx, mz, dash: performance.now() - dashAt < 150 };
}
const cv = renderer.domElement;
cv.addEventListener("pointerdown", (e) => {
  unlockAudio();
  if (e.pointerType === "mouse" || stick.id >= 0) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  Object.assign(stick, { id: e.pointerId, x: e.clientX, y: e.clientY, mx: 0, mz: 0 });
  Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerId !== stick.id) return;
  const dx = e.clientX - stick.x, dy = e.clientY - stick.y, d = Math.hypot(dx, dy), k = Math.min(1, d / 50) / (d || 1);
  stick.mx = dx * k; stick.mz = dy * k;
  $("stick").firstElementChild.style.transform = `translate(${stick.mx * 35}px, ${stick.mz * 35}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) { Object.assign(stick, { id: -1, mx: 0, mz: 0 }); $("stick").hidden = true; } });
const db = $("dash");
db.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); dashAt = performance.now(); db.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) db.addEventListener(ev, () => db.classList.remove("on"));
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const camPos = new THREE.Vector3(0, 22, 20), camLook = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  let g = game();
  if (g && keyOf(g) !== local.key) onNewKey(g);
  if (isHost()) hostTick(dt); else host.wasHost = false;
  g = game();
  if (g) { myTick(dt, g); drawWorld(dt, g, now); }
  drawScenery(dt, now);
  renderer.render(scene, camera);
  if (g && now - lastHud > 100) { lastHud = now; hud(g); }
  db.classList.toggle("wait", me.dashCd > 0);
}
function drawWorld(dt, g, now) {
  const t = arenaTime(g), key = local.key, seen = new Set(), pnow = performance.now(), live = livePlayers();
  ring.draw(t, now);
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.includes(id)) continue; // a closed or frozen tab: not drawn
    const r = remoteOf(id);
    if (!r || r.p.k !== key || r.p.y < SEA_Y - 2) continue;
    seen.add(id);
    if (!views.has(id)) views.set(id, makeBumper(p.c || "#ccc", p.n || "Player"));
    const v = views.get(id), age = Math.min(0.12, (pnow - r.at) / 1000);
    recolor(v, p.c || "#ccc");
    drawBumper(v, r.p.x + r.p.vx * age, r.p.y, r.p.z + r.p.vz * age, r.p.h, Math.hypot(r.p.vx, r.p.vz), r.p.d, dt, true, t);
  }
  const hosting = isHost(), raw = S.shared.bots;
  if (!hosting && raw !== botsSeen.raw) botsSeen = { raw, at: pnow };
  const age = hosting ? 0 : Math.min(0.12, (pnow - botsSeen.at) / 1000);
  for (const b of botList()) {
    seen.add(b.i);
    if (!views.has(b.i)) views.set(b.i, makeBumper(b.c, b.n));
    const v = views.get(b.i); recolor(v, b.c);
    drawBumper(v, b.x + (b.vx || 0) * age, b.y, b.z + (b.vz || 0) * age, b.h, Math.hypot(b.vx || 0, b.vz || 0), b.d, dt, !hosting, t);
  }
  for (const [id, v] of views) { if (!seen.has(id)) hideBumper(v); v.crown.visible = (g.phase === "results" && g.win === id) || (g.phase === "over" && g.rw === id); }
  if (!me.view) me.view = makeBumper(myColor, "");
  if (g.inRound.includes(net.sessionId) && me.y > SEA_Y - 2) drawBumper(me.view, me.x, me.y, me.z, me.h, Math.hypot(me.vx, me.vz), me.dashT > 0, dt, false, t); else hideBumper(me.view);
  me.view.crown.visible = (g.phase === "results" && g.win === net.sessionId) || (g.phase === "over" && g.rw === net.sessionId);
  const winner = g.phase === "results" ? g.win : g.phase === "over" ? g.rw : null;
  if (winner && Math.random() < dt * 5) { const w = winner === net.sessionId ? me.view : views.get(winner); if (w) burst(w.x, w.y + 2.6, w.z, COLORS[Math.floor(Math.random() * COLORS.length)], 10, 8); }
  // camera: high and behind, drifting toward my bumper; ?attract circles the ring
  if (ATTRACT) {
    const a = now / 9000, d = 4 + ring.radiusAt(t) * 0.95; // closer in as the ring shrinks
    camPos.set(Math.sin(a) * d, d * 0.85, Math.cos(a) * d); camera.position.lerp(camPos, 0.04); camLook.set(0, -1.5, 0);
  } else {
    const far = camera.aspect < 1 ? 1.25 + 0.55 / Math.max(0.45, camera.aspect) : 1, f = amIn(g) ? 0.35 : 0; // phones in portrait: further back
    camPos.set(me.x * f, 18 * far, me.z * f + 16 * far * (camera.aspect < 1 ? 0.6 : 1)); camLook.set(me.x * f, -1, me.z * f - 1); // steeper on a tall phone
    camera.position.lerp(camPos, 1 - Math.pow(0.02, dt));
  }
  local.shake *= Math.exp(-dt * 6);
  camera.lookAt(camLook);
  if (local.shake > 0.01) camera.position.add(v3.set((Math.random() - 0.5) * local.shake, (Math.random() - 0.5) * local.shake, 0));
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("bump", (m) => { if (m && typeof m === "object") bumpFx(m); });
  net.on("again", () => { const g = game(); if (isHost() && g) playAgain(g); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 8, introMs: 600, overMs: 1600, winsToWin: 99, warnTime: 1, botDash: 0.25, dashCooldown: 0.8, pop: 6, shrinkStart: 0.3, ringEvery: 2.2, ringSpread: 1.2 });
  requestAnimationFrame(frame);
})();
</script>
</body>
